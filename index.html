<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление бронированиями</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Стили для менеджеров */
    .booking-natalia {
      background-color: rgba(239, 68, 68, 0.15);
      border-left: 4px solid #ef4444;
      color: #991b1b;
    }
    
    .booking-stasya {
      background-color: rgba(168, 85, 247, 0.15);
      border-left: 4px solid #a855f7;
      color: #581c87;
    }

    .badge-natalia {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .badge-stasya {
      background-color: #f3e8ff;
      color: #581c87;
      border: 1px solid #d8b4fe;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Шапка -->
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <h1 class="text-2xl font-bold text-gray-900">Дашборд бронирований</h1>
      <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
        + Добавить бронь
      </button>
    </div>

    <!-- Фильтры и статистика -->
    <div class="flex gap-4 items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <span class="text-sm font-semibold text-gray-500">Менеджеры:</span>
      <span class="px-3 py-1 rounded-full text-xs font-semibold badge-natalia">Наталия (Красный)</span>
      <span class="px-3 py-1 rounded-full text-xs font-semibold badge-stasya">Стася (Фиолетовый)</span>
    </div>

    <!-- Таблица / Список броней -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-100 text-xs text-gray-500 uppercase tracking-wider">
            <th class="p-4">Апартаменты</th>
            <th class="p-4">Гость</th>
            <th class="p-4">Даты</th>
            <th class="p-4">Ответственный</th>
            <th class="p-4">Статус</th>
            <th class="p-4 text-right">Действия</th>
          </tr>
        </thead>
        <tbody id="bookingsTableBody" class="divide-y divide-gray-100 text-sm">
          <!-- Данные загружаются динамически через JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Модальное окно создания/редактирования брони -->
  <div id="bookingModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-gray-900" id="modalTitle">Добавить бронирование</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
      </div>

      <form id="bookingForm" onsubmit="saveBooking(event)" class="space-y-4">
        <input type="hidden" id="bookingId">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Апартаменты</label>
          <input type="text" id="apartment" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Имя гостя</label>
          <input type="text" id="guestName" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Заезд</label>
            <input type="date" id="checkIn" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Выезд</label>
            <input type="date" id="checkOut" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Чья бронь (Менеджер)</label>
          <select id="manager" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Наталия">Наталия</option>
            <option value="Стася">Стася</option>
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">
            Отмена
          </button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">
            Сохранить
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Исходные данные бронирований
    let bookings = [
      { id: 1, apartment: 'Апартамент 101', guestName: 'Алексей Иванов', checkIn: '2026-08-15', checkOut: '2026-08-20', manager: 'Наталия' },
      { id: 2, apartment: 'Апартамент 204', guestName: 'Мария Сидорова', checkIn: '2026-08-18', checkOut: '2026-08-25', manager: 'Стася' }
    ];

    // Отрисовка таблицы
    function renderBookings() {
      const tbody = document.getElementById('bookingsTableBody');
      tbody.innerHTML = '';

      bookings.forEach(b => {
        const isNatalia = b.manager === 'Наталия';
        const rowClass = isNatalia ? 'booking-natalia' : 'booking-stasya';
        const badgeClass = isNatalia ? 'badge-natalia' : 'badge-stasya';

        const tr = document.createElement('tr');
        tr.className = `${rowClass} transition-colors hover:opacity-90`;
        tr.innerHTML = `
          <td class="p-4 font-semibold">${b.apartment}</td>
          <td class="p-4">${b.guestName}</td>
          <td class="p-4">${b.checkIn} — ${b.checkOut}</td>
          <td class="p-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeClass}">
              ${b.manager}
            </span>
          </td>
          <td class="p-4"><span class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded">Затверждено</span></td>
          <td class="p-4 text-right space-x-2">
            <button onclick="editBooking(${b.id})" class="text-blue-600 hover:underline font-medium text-xs">Редактировать</button>
            <button onclick="deleteBooking(${b.id})" class="text-red-600 hover:underline font-medium text-xs">Удалить</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Открытие модального окна для добавления
    function openModal() {
      document.getElementById('bookingForm').reset();
      document.getElementById('bookingId').value = '';
      document.getElementById('modalTitle').innerText = 'Добавить бронирование';
      document.getElementById('bookingModal').classList.remove('hidden');
      document.getElementById('bookingModal').classList.add('flex');
    }

    // Закрытие модального окна
    function closeModal() {
      document.getElementById('bookingModal').classList.add('hidden');
      document.getElementById('bookingModal').classList.remove('flex');
    }

    // Редактирование существующей брони
    function editBooking(id) {
      const item = bookings.find(b => b.id === id);
      if (!item) return;

      document.getElementById('bookingId').value = item.id;
      document.getElementById('apartment').value = item.apartment;
      document.getElementById('guestName').value = item.guestName;
      document.getElementById('checkIn').value = item.checkIn;
      document.getElementById('checkOut').value = item.checkOut;
      document.getElementById('manager').value = item.manager;

      document.getElementById('modalTitle').innerText = 'Редактировать бронирование';
      document.getElementById('bookingModal').classList.remove('hidden');
      document.getElementById('bookingModal').classList.add('flex');
    }

    // Сохранение (создание или обновление)
    function saveBooking(event) {
      event.preventDefault();

      const id = document.getElementById('bookingId').value;
      const apartment = document.getElementById('apartment').value;
      const guestName = document.getElementById('guestName').value;
      const checkIn = document.getElementById('checkIn').value;
      const checkOut = document.getElementById('checkOut').value;
      const manager = document.getElementById('manager').value;

      if (id) {
        const index = bookings.findIndex(b => b.id == id);
        if (index !== -1) {
          bookings[index] = { id: Number(id), apartment, guestName, checkIn, checkOut, manager };
        }
      } else {
        const newId = bookings.length ? Math.max(...bookings.map(b => b.id)) + 1 : 1;
        bookings.push({ id: newId, apartment, guestName, checkIn, checkOut, manager });
      }

      closeModal();
      renderBookings();
    }

    // Удаление брони
    function deleteBooking(id) {
      if (confirm('Удалить эту запись?')) {
        bookings = bookings.filter(b => b.id !== id);
        renderBookings();
      }
    }

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', renderBookings);
  </script>
</body>
</html>
